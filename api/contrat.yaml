openapi: 3.0.3
info:
  title: Contrat API — Épreuve finale KFOKAM48
  version: "1.0"
  description: |
    Les cinq premières opérations (sessions, presences, exercices, relectures POST,
    tableau) sont IMPOSÉES par le sujet et reproduites ici à l'identique :
    mêmes chemins, mêmes verbes, mêmes codes de statut, même format d'erreur.
    Les opérations suivantes ont été ajoutées pour combler les besoins identifiés
    dans docs/CAHIER_DES_CHARGES.md, section 7 (trou et contradiction du sujet)
    et pour alimenter les trois écrans du frontend (F2).

servers:
  - url: http://localhost:8080

paths:

  # ────────────────────────────────────────────────────────────
  # Opérations imposées — ne pas modifier chemin/verbe/statuts
  # ────────────────────────────────────────────────────────────

  /api/sessions:
    post:
      summary: Le formateur ouvre une session et obtient un code de présence
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre, promotionId]
              properties:
                titre: { type: string }
                promotionId: { type: integer, format: int64 }
      responses:
        "201":
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                required: [id, code, ouvertureAt, expirationAt]
                properties:
                  id: { type: integer, format: int64 }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Erreur" }   # CHAMP_MANQUANT

  /api/presences:
    post:
      summary: Un étudiant marque sa présence avec le code
      tags: [Presences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, etudiantId]
              properties:
                code: { type: string }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # CODE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT
        "410": { $ref: "#/components/responses/Erreur" }   # CODE_EXPIRE
        "429": { $ref: "#/components/responses/Erreur" }   # TROP_DE_TENTATIVES (RG4, ajout non imposé mais nécessaire)

  /api/exercices:
    post:
      summary: Un étudiant dépose le lien de son exercice
      tags: [Exercices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId, lien]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
                lien: { type: string, format: uri }
      responses:
        "201":
          description: Exercice déposé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string, enum: [DEPOSE, EN_ATTENTE_RELECTURE] }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "409": { $ref: "#/components/responses/Erreur" }   # EXERCICE_DEJA_DEPOSE

  /api/relectures/{id}:
    post:
      summary: Un relecteur rend sa note et son commentaire — première soumission uniquement
      description: |
        Voir docs/CAHIER_DES_CHARGES.md section 7 : ce POST reste réservé à la
        première soumission (409 si déjà rendue). La correction (RG10) passe par
        PATCH /api/relectures/{id}, ajouté plus bas.
      tags: [Relectures]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200": { description: Relecture enregistrée }
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE
        "403": { $ref: "#/components/responses/Erreur" }   # AUTO_RELECTURE
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_RENDUE
    patch:
      summary: Le relecteur corrige une relecture déjà rendue (RG10), tant que la session n'est pas clôturée
      description: |
        Opération ajoutée — résout la contradiction Q10/Q15 (section 7) : POST
        reste la première soumission, PATCH est réservé à la correction.
      tags: [Relectures]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200": { description: Relecture corrigée }
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE
        "404": { $ref: "#/components/responses/Erreur" }   # RELECTURE_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_CLOTUREE

  /api/tableau:
    get:
      summary: Le tableau récapitulatif du formateur
      tags: [Tableau]
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Récapitulatif par étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [etudiantId, nom, presences, exercicesDeposes, moyenne, relecturesEnAttente]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
                    presences: { type: integer }
                    exercicesDeposes: { type: integer }
                    moyenne: { type: number, nullable: true }
                    relecturesEnAttente: { type: integer }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  # ────────────────────────────────────────────────────────────
  # Opérations ajoutées — cf. CAHIER_DES_CHARGES.md section 7
  # ────────────────────────────────────────────────────────────

  /api/sessions/{id}/cloture:
    patch:
      summary: Le formateur clôture une session (verrouille présences, exercices, relectures)
      description: |
        Comble le trou identifié section 7 : aucune des 16 questions du client ne
        définissait cette action, alors que Q10/Q12/Q13/Q15 la citent toutes comme
        déclencheur (RG15).
      tags: [Sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Session clôturée
          content:
            application/json:
              schema:
                type: object
                required: [id, statut, clotureAt]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string, enum: [CLOTUREE] }
                  clotureAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_DEJA_CLOTUREE

  /api/sessions/{id}/presences:
    post:
      summary: Le formateur ajoute une présence manuellement (source FORMATEUR)
      description: Distinct de POST /api/presences (RG14) — pas de code requis, action du formateur.
      tags: [Presences]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [etudiantId]
              properties:
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence ajoutée par le formateur
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [FORMATEUR] }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT

  /api/exercices/{id}:
    put:
      summary: L'étudiant remplace le lien de son exercice (RG13)
      description: Refusé dès qu'un relecteur a été assigné, assimilé à "relecture commencée" (cf. section 7).
      tags: [Exercices]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lien]
              properties:
                lien: { type: string, format: uri }
      responses:
        "200":
          description: Lien remplacé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string, enum: [DEPOSE] }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_COMMENCEE

  # ────────────────────────────────────────────────────────────
  # Lectures nécessaires aux trois écrans (F2)
  # ────────────────────────────────────────────────────────────

  /api/promotions/{id}/etudiants:
    get:
      summary: Liste des étudiants d'une promotion — alimente la liste de choix (Q1, pas de mot de passe)
      tags: [Promotions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Liste des étudiants
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/sessions/{id}:
    get:
      summary: Détail d'une session (code, expiration, statut)
      tags: [Sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Détail de la session
          content:
            application/json:
              schema:
                type: object
                required: [id, titre, code, ouvertureAt, expirationAt, statut]
                properties:
                  id: { type: integer, format: int64 }
                  titre: { type: string }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
                  clotureAt: { type: string, format: date-time, nullable: true }
                  statut: { type: string, enum: [OUVERTE, EXPIREE, CLOTUREE] }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE

  /api/etudiants/{id}/exercices:
    get:
      summary: Exercices déposés par un étudiant, avec la note/commentaire reçus si rendus (EF17, sans identité du relecteur — RG8)
      tags: [Exercices]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: sessionId
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Exercices de l'étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, sessionId, lien, statut]
                  properties:
                    id: { type: integer, format: int64 }
                    sessionId: { type: integer, format: int64 }
                    lien: { type: string, format: uri }
                    statut: { type: string, enum: [DEPOSE, EN_ATTENTE_RELECTURE, RELU] }
                    note: { type: integer, nullable: true }
                    commentaire: { type: string, nullable: true }
        "404": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU

  /api/etudiants/{id}/relectures:
    get:
      summary: Relectures assignées à un étudiant en tant que relecteur (EF18), rendues ou non
      tags: [Relectures]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Relectures assignées
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, exerciceId, statut]
                  properties:
                    id: { type: integer, format: int64 }
                    exerciceId: { type: integer, format: int64 }
                    lien: { type: string, format: uri }
                    statut: { type: string, enum: [EN_ATTENTE, RENDUE] }
                    note: { type: integer, nullable: true }
                    commentaire: { type: string, nullable: true }
        "404": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU

components:
  schemas:
    Erreur:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Identifiant stable, en majuscules. Exemple - CODE_EXPIRE
        message:
          type: string
          description: Phrase lisible par un humain, en français
  responses:
    Erreur:
      description: |
        Format d'erreur imposé pour TOUTES les erreurs, sans exception.
        Une stack trace, un corps vide ou la page d'erreur par défaut de Spring
        valent zéro sur ce critère.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
          example:
            code: CODE_EXPIRE
            message: Le code de présence a expiré.
